[project]
name = "morpho"
version = "0.1.0"
description = "Morpho: agente de soporte al cliente de TiendaHogar con RAG, consulta de pedidos y escalamiento a humanos."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0,<2",
    "fastembed>=0.8.1,<0.9",
    # huggingface_hub 1.x caches model files as symlinks, and onnxruntime 1.30 refuses
    # EmbeddingGemma's external weights when they resolve outside the model folder.
    "huggingface-hub>=0.36,<1",
    "mcp>=2.3.0,<3",
    "numpy>=2.5.3,<3",
    "python-dotenv>=1.2.4,<2",
    "starlette>=1.7.0,<2",
    "text2num>=3.1.0,<4",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
morpho = "morpho.cli:main"
morpho-mcp = "morpho.mcp_server:main"
morpho-ui = "morpho.web.server:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: calls the real Claude API; needs ANTHROPIC_API_KEY (run with: pytest -m live)",
    "challenge: the three cases the challenge asks for (run with: pytest -m challenge)",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
